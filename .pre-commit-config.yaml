# Pre-commit hooks for AntennaPod
# See https://pre-commit.com for more information
# Install: pre-commit install

default_install_hook_types: [pre-commit, commit-msg]
default_language_version:
  python: python3

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
      - id: end-of-file-fixer
        exclude: '\.jar$'
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # XML formatting for Android layouts
  - repo: local
    hooks:
      - id: android-xml-formatter
        name: Android XML Formatter
        entry: bash -c 'if [ -f android-xml-formatter.jar ]; then find . -wholename "*/res/layout/*.xml" -print0 | xargs -0 java -jar android-xml-formatter.jar; else echo "Skipping XML format (android-xml-formatter.jar not found)"; fi'
        language: system
        files: '\.xml$'
        pass_filenames: false

  # Gradle and Android checks
  - repo: local
    hooks:
      - id: checkstyle
        name: Checkstyle
        entry: ./gradlew checkstyle
        language: system
        files: \.java$
        pass_filenames: false
      - id: android-lint
        name: Android Lint
        entry: ./gradlew :app:lintPlayDebug
        language: system
        files: \.(java|xml)$
        pass_filenames: false
      - id: spotbugs
        name: SpotBugs
        entry: ./gradlew spotbugsPlayDebug spotbugsDebug
        language: system
        files: \.java$
        pass_filenames: false
